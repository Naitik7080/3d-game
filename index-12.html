<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Highway Rush 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#111;color:#fff}
#game{position:fixed;inset:0}canvas{display:block}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;z-index:20;background:rgba(0,0,0,.58)}
.panel{width:min(92%,430px);padding:28px;border:1px solid rgba(255,255,255,.18);border-radius:24px;background:rgba(15,18,25,.86);backdrop-filter:blur(12px);box-shadow:0 20px 70px #0008}
h1{font-size:44px;margin:0 0 4px;letter-spacing:2px}h2{font-size:34px;margin:5px}
.sub{opacity:.8;margin:8px 0 22px}.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button{border:0;border-radius:14px;padding:13px 20px;font-size:16px;font-weight:700;cursor:pointer;background:#ffd21a;color:#111;box-shadow:0 4px 0 #a98200}
button.secondary{background:#273142;color:#fff;box-shadow:none}.hidden{display:none!important}
#hud{position:fixed;z-index:10;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.stat{background:#0008;padding:8px 11px;border-radius:12px;text-shadow:0 2px 3px #000;min-width:90px}
#pause{pointer-events:auto;padding:8px 12px;background:#0008;color:#fff;box-shadow:none}
#nitroWrap{position:fixed;z-index:11;left:50%;bottom:102px;transform:translateX(-50%);width:min(260px,55%);background:#0009;border-radius:20px;padding:4px}
#nitroBar{height:12px;border-radius:15px;width:100%;background:#19d9ff;transition:.1s}
#controls{position:fixed;z-index:12;left:0;right:0;bottom:18px;display:flex;justify-content:space-between;padding:0 20px;pointer-events:none}
.ctrl{pointer-events:auto;width:70px;height:70px;border-radius:50%;background:#0008;border:2px solid #fff8;color:#fff;font-size:28px;box-shadow:none;touch-action:none}
#nitroBtn{width:86px;border-radius:18px;font-size:15px;background:#18bfe8;color:#fff;box-shadow:none}
#toast{position:fixed;z-index:30;top:72px;left:50%;transform:translateX(-50%);background:#000b;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none}
.cardGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.card{padding:14px;background:#202632;border-radius:15px}
.card b{display:block;font-size:20px}.small{font-size:12px;opacity:.7}
</style>
</head>
<body>
<div id="game"></div>

<div id="hud" class="hidden">
  <div class="stat">🏆 <span id="score">0</span></div>
  <div class="stat">🛣️ <span id="distance">0</span> m</div>
  <div class="stat">⚡ <span id="speed">0</span> km/h</div>
  <button id="pause">Ⅱ</button>
</div>
<div id="nitroWrap" class="hidden"><div id="nitroBar"></div></div>
<div id="controls" class="hidden">
  <button class="ctrl" id="left">◀</button>
  <button class="ctrl" id="nitroBtn">NITRO</button>
  <button class="ctrl" id="right">▶</button>
</div>
<div id="toast"></div>

<div id="menu" class="overlay">
 <div class="panel">
  <h1>HIGHWAY RUSH</h1><div class="sub">3D Traffic Racing</div>
  <div class="cardGrid">
   <div class="card">🚗<b>Garage</b><span class="small">3 cars + upgrades</span></div>
   <div class="card">🌦️<b>Weather</b><span class="small">Day / Sunset / Night / Rain</span></div>
   <div class="card">🚘<b>Traffic</b><span class="small">Cars, buses & trucks</span></div>
   <div class="card">⚡<b>Nitro</b><span class="small">Boost your speed</span></div>
  </div>
  <button id="play">START RACE</button>
  <button id="garage" class="secondary">GARAGE</button>
  <button id="settings" class="secondary">SETTINGS</button>
 </div>
</div>

<div id="garagePanel" class="overlay hidden"><div class="panel">
 <h2>🚗 GARAGE</h2><div>Coins: <b id="coins">0</b></div>
 <div class="cardGrid" id="cars"></div>
 <button id="backGarage" class="secondary">BACK</button>
</div></div>

<div id="settingsPanel" class="overlay hidden"><div class="panel">
 <h2>⚙ SETTINGS</h2>
 <p>Weather</p><div class="row">
  <button data-weather="day">☀️ Day</button><button data-weather="sunset">🌇 Sunset</button>
  <button data-weather="night">🌙 Night</button><button data-weather="rain">🌧️ Rain</button>
 </div>
 <p>Control: <b>Arrow Keys / A-D</b> or touch buttons</p>
 <button id="backSettings" class="secondary">BACK</button>
</div></div>

<div id="gameover" class="overlay hidden"><div class="panel">
 <h2>💥 CRASH!</h2><p>Score: <b id="finalScore">0</b></p><p>Distance: <b id="finalDistance">0</b> m</p>
 <button id="again">RACE AGAIN</button><button id="home" class="secondary">MAIN MENU</button>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,45,190);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,320);
camera.position.set(0,4.5,9);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById("game").appendChild(renderer.domElement);

const hemi=new THREE.HemisphereLight(0xbfe9ff,0x45652f,2.1);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(-35,55,25);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(600,600),new THREE.MeshStandardMaterial({color:0x477b3d,roughness:1}));
ground.rotation.x=-Math.PI/2;ground.position.y=-.08;scene.add(ground);
const road=new THREE.Mesh(new THREE.PlaneGeometry(13,600),new THREE.MeshStandardMaterial({color:0x292c30,roughness:.94}));
road.rotation.x=-Math.PI/2;scene.add(road);

for(const x of [-6.6,6.6]){
 const s=new THREE.Mesh(new THREE.BoxGeometry(.18,.04,600),new THREE.MeshStandardMaterial({color:0xffffff}));
 s.position.set(x,.03,0);scene.add(s);
}
const dashes=[];
for(let z=-290;z<80;z+=8)for(const x of [-2,2]){
 const d=new THREE.Mesh(new THREE.BoxGeometry(.13,.025,3.7),new THREE.MeshStandardMaterial({color:0xffffff}));
 d.position.set(x,.035,z);scene.add(d);dashes.push(d);
}
const roadside=[];
function makeTree(x,z){
 const g=new THREE.Group();
 const t=new THREE.Mesh(new THREE.CylinderGeometry(.18,.25,1.4,8),new THREE.MeshStandardMaterial({color:0x70452a}));
 t.position.y=.7;g.add(t);
 const c=new THREE.Mesh(new THREE.SphereGeometry(.82,12,10),new THREE.MeshStandardMaterial({color:0x176b2c,roughness:1}));
 c.position.y=1.8;g.add(c);g.position.set(x,0,z);scene.add(g);roadside.push(g);
}
for(let z=-290;z<90;z+=13){makeTree(-9-Math.random()*3,z);makeTree(9+Math.random()*3,z+5)}

function makeCar(color=0xe21c2c,type="car"){
 const g=new THREE.Group();
 const bodyMat=new THREE.MeshStandardMaterial({color,metalness:.45,roughness:.25});
 const dark=new THREE.MeshStandardMaterial({color:0x10151b,roughness:.2});
 const glass=new THREE.MeshStandardMaterial({color:0x173043,metalness:.2,roughness:.1});
 let bodyW=1.75,bodyL=3.45,bodyH=.52;
 if(type==="truck"){bodyW=2.15;bodyL=4.6;bodyH=.9}
 const body=new THREE.Mesh(new THREE.BoxGeometry(bodyW,bodyH,bodyL),bodyMat);
 body.position.y=.58;body.castShadow=true;g.add(body);
 if(type!=="truck"){
  const hood=new THREE.Mesh(new THREE.BoxGeometry(1.55,.28,.8),bodyMat);
  hood.position.set(0,.86,-1.15);g.add(hood);
  const cab=new THREE.Mesh(new THREE.BoxGeometry(1.34,.58,1.55),glass);
  cab.position.set(0,1.05,.35);cab.castShadow=true;g.add(cab);
 }else{
  const cab=new THREE.Mesh(new THREE.BoxGeometry(1.65,1.05,1.25),glass);
  cab.position.set(0,1.35,1.05);g.add(cab);
 }
 for(const x of [-bodyW*.54,bodyW*.54])for(const z of [-bodyL*.29,bodyL*.29]){
  const w=new THREE.Mesh(new THREE.CylinderGeometry(.33,.33,.24,18),dark);
  w.rotation.z=Math.PI/2;w.position.set(x,.38,z);w.castShadow=true;g.add(w);
 }
 for(const x of [-.55,.55]){
  const l=new THREE.Mesh(new THREE.BoxGeometry(.32,.12,.06),
   new THREE.MeshStandardMaterial({color:0xffffdd,emissive:0xffffaa,emissiveIntensity:1.6}));
  l.position.set(x,.72,-bodyL/2-.03);g.add(l);
 }
 return g;
}
const cars=[];
let selectedCar=0;
const carData=[
 {name:"Sport",color:0xe21c2c,cost:0,speed:62,handling:1},
 {name:"GT Blue",color:0x1769aa,cost:300,speed:70,handling:1.1},
 {name:"Supercar",color:0xffb300,cost:800,speed:78,handling:1.2}
];
let coins=Number(localStorage.getItem("hrCoins")||0);
let upgrades=Number(localStorage.getItem("hrUpgrade")||0);
const player=makeCar(carData[0].color);player.position.set(0,0,3);scene.add(player);

function save(){localStorage.setItem("hrCoins",coins);localStorage.setItem("hrUpgrade",upgrades)}
function rebuildPlayer(){
 scene.remove(player); // keep object reference by replacing is awkward; copy new geometry into scene
}
function setPlayerColor(){
 player.traverse(o=>{if(o.isMesh&&o.material&&o.material.color){
   // body materials are first type; don't recolor glass/dark
 }});
 const newCar=makeCar(carData[selectedCar].color);
 newCar.position.copy(player.position);newCar.rotation.copy(player.rotation);
 scene.remove(player);
 window.playerRef=newCar;scene.add(newCar);
}
let playerRef=player;

function spawnTraffic(z){
 const lane=[-4,-2,0,2,4][Math.floor(Math.random()*5)];
 const roll=Math.random(),type=roll<.12?"truck":"car";
 const col=[0x1769aa,0xffb300,0xeeeeee,0x6a1b9a,0x1b8f45,0x222222,0xd83b20][Math.floor(Math.random()*7)];
 const c=makeCar(col,type);c.scale.set(type==="truck"?1:0.88,type==="truck"?1:0.88,type==="truck"?1:0.88);
 c.position.set(lane,0,z);scene.add(c);cars.push(c);
}
for(let i=0;i<12;i++)spawnTraffic(-35-i*23-Math.random()*22);

let running=false,paused=false,score=0,distance=0,speed=34,nitro=100,steer=0,last=performance.now(),weather="day",nitroOn=false;

function toast(t){const e=document.getElementById("toast");e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,1300)}
function start(){
 running=true;paused=false;score=0;distance=0;speed=34;nitro=100;steer=0;
 playerRef.position.set(0,0,3);playerRef.rotation.set(0,0,0);
 document.getElementById("menu").classList.add("hidden");document.getElementById("gameover").classList.add("hidden");
 ["hud","controls","nitroWrap"].forEach(id=>document.getElementById(id).classList.remove("hidden"));
}
function crash(){
 running=false;nitroOn=false;
 document.getElementById("finalScore").textContent=Math.floor(score);
 document.getElementById("finalDistance").textContent=Math.floor(distance);
 coins+=Math.floor(distance/80);save();
 document.getElementById("gameover").classList.remove("hidden");
}
function recycle(c){c.position.z=-250-Math.random()*110;c.position.x=[-4,-2,0,2,4][Math.floor(Math.random()*5)];}
function update(dt){
 const data=carData[selectedCar];
 const base=Math.min(data.speed+upgrades*4,100);
 let actual=speed;
 if(nitroOn&&nitro>0){actual+=32+upgrades*3;nitro-=35*dt}else{nitro=Math.min(100,nitro+7*dt)}
 speed=THREE.MathUtils.lerp(speed,base,.015);
 playerRef.position.x+=steer*(7+data.handling*1.2)*dt;
 playerRef.position.x=THREE.MathUtils.clamp(playerRef.position.x,-4.8,4.8);
 playerRef.rotation.z=THREE.MathUtils.lerp(playerRef.rotation.z,-steer*.065,.13);
 const dz=actual*dt;
 dashes.forEach(d=>{d.position.z+=dz;if(d.position.z>15)d.position.z-=380});
 roadside.forEach(o=>{o.position.z+=dz;if(o.position.z>18)o.position.z-=380});
 cars.forEach(c=>{
   c.position.z+=dz*(.65+Math.random()*.012);
   if(c.position.z>18){recycle(c);score+=12}
   const dx=Math.abs(c.position.x-playerRef.position.x),zz=Math.abs(c.position.z-playerRef.position.z);
   if(dx<1.35&&zz<2.2)crash();
 });
 distance+=actual*dt;score+=actual*dt*.42;
 document.getElementById("score").textContent=Math.floor(score);
 document.getElementById("distance").textContent=Math.floor(distance);
 document.getElementById("speed").textContent=Math.floor(actual*3.2);
 document.getElementById("nitroBar").style.width=nitro+"%";
 camera.position.x=THREE.MathUtils.lerp(camera.position.x,playerRef.position.x*.3,.08);
 camera.lookAt(playerRef.position.x*.35,.75,-9);
}
function animate(now){
 requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.04);last=now;
 if(running&&!paused)update(dt);renderer.render(scene,camera);
}
animate(performance.now());

function showGarage(){
 document.getElementById("menu").classList.add("hidden");document.getElementById("garagePanel").classList.remove("hidden");
 document.getElementById("coins").textContent=coins;
 const box=document.getElementById("cars");box.innerHTML="";
 carData.forEach((c,i)=>{
  const owned=i===0||coins>=c.cost||localStorage.getItem("car"+i)==="1";
  const d=document.createElement("div");d.className="card";
  d.innerHTML=`<div style="font-size:28px">🚗</div><b>${c.name}</b><span class="small">Top speed ${c.speed} km/h</span><br><button>${i===selectedCar?"SELECTED":owned?"SELECT":"🔒 "+c.cost+" coins"}</button>${i===selectedCar?"":owned&&i>0?'<br><button class="secondary">Upgrade +4</button>':""}`;
  const bs=d.querySelectorAll("button");
  bs[0].onclick=()=>{if(owned){selectedCar=i;setPlayerColor();toast(c.name+" selected");showGarage()}else if(coins>=c.cost){coins-=c.cost;localStorage.setItem("car"+i,"1");save();showGarage()}};
  if(bs[1])bs[1].onclick=()=>{if(coins>=150){coins-=150;upgrades++;save();toast("Upgrade purchased");showGarage()}else toast("Need 150 coins")};
  box.appendChild(d);
 });
}
function setWeather(w){
 weather=w;
 const cfg={day:[0x87ceeb,0xffffff,2.5],sunset:[0xd88965,0xffb080,1.7],night:[0x07152e,0x8095bd,.65],rain:[0x6f7f8d,0xc9d3dc,1.1]}[w];
 scene.background.setHex(cfg[0]);scene.fog.color.setHex(cfg[0]);sun.color.setHex(cfg[1]);sun.intensity=cfg[2];
 toast("Weather: "+w);
}
document.getElementById("play").onclick=start;
document.getElementById("again").onclick=start;
document.getElementById("home").onclick=()=>{document.getElementById("gameover").classList.add("hidden");document.getElementById("menu").classList.remove("hidden");["hud","controls","nitroWrap"].forEach(id=>document.getElementById(id).classList.add("hidden"))};
document.getElementById("garage").onclick=showGarage;
document.getElementById("backGarage").onclick=()=>{document.getElementById("garagePanel").classList.add("hidden");document.getElementById("menu").classList.remove("hidden")};
document.getElementById("settings").onclick=()=>{document.getElementById("menu").classList.add("hidden");document.getElementById("settingsPanel").classList.remove("hidden")};
document.getElementById("backSettings").onclick=()=>{document.getElementById("settingsPanel").classList.add("hidden");document.getElementById("menu").classList.remove("hidden")};
document.querySelectorAll("[data-weather]").forEach(b=>b.onclick=()=>setWeather(b.dataset.weather));
document.getElementById("pause").onclick=()=>{paused=!paused;document.getElementById("pause").textContent=paused?"▶":"Ⅱ";toast(paused?"Paused":"Resume")};

function hold(el,v){
 el.addEventListener("pointerdown",e=>{e.preventDefault();steer=v});
 ["pointerup","pointercancel","pointerleave"].forEach(x=>el.addEventListener(x,()=>steer=0));
}
hold(document.getElementById("left"),-1);hold(document.getElementById("right"),1);
document.getElementById("nitroBtn").addEventListener("pointerdown",()=>nitroOn=true);
["pointerup","pointercancel","pointerleave"].forEach(x=>document.getElementById("nitroBtn").addEventListener(x,()=>nitroOn=false));
addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")steer=-1;
 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")steer=1;
 if(e.code==="Space")nitroOn=true;
});
addEventListener("keyup",e=>{
 if(["ArrowLeft","ArrowRight","a","d"].includes(e.key))steer=0;
 if(e.code==="Space")nitroOn=false;
});
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
