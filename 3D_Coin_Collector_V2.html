<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D Coin Collector V2</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#000;font-family:Arial,sans-serif;touch-action:none}
#hud{position:fixed;top:12px;left:12px;z-index:10;color:#fff;background:rgba(0,0,0,.6);padding:12px 16px;border-radius:14px;font-size:17px;line-height:1.55;user-select:none}
#objective{position:fixed;top:12px;right:12px;z-index:10;color:#fff;background:rgba(0,0,0,.6);padding:10px 14px;border-radius:14px;text-align:right;font-size:14px}
#message{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:30;background:rgba(0,0,0,.35)}
#box{background:rgba(10,10,15,.92);color:#fff;text-align:center;padding:30px 38px;border-radius:22px;box-shadow:0 12px 50px #000;min-width:280px}
#box h1{margin:0 0 10px;font-size:34px}#box p{margin:8px 0}
#controls{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:10;color:#fff;background:rgba(0,0,0,.55);padding:8px 13px;border-radius:10px;font-size:13px}
#touch{display:none;position:fixed;bottom:35px;left:25px;z-index:20;width:150px;height:150px}
.btn{position:absolute;width:52px;height:52px;border:0;border-radius:15px;background:rgba(255,255,255,.25);color:white;font-size:24px}
#up{left:49px;top:0}#down{left:49px;bottom:0}#left{left:0;top:49px}#right{right:0;top:49px}
@media(max-width:700px){#controls{display:none}#touch{display:block}}
</style>
</head>
<body>
<div id="hud">
🪙 Coins: <b id="score">0</b>/12<br>
❤️ Health: <b id="health">100</b>%<br>
🏃 Speed: <b id="speed">Normal</b>
</div>
<div id="objective">🎯 Collect all coins<br>👹 Avoid the enemy!</div>
<div id="controls">WASD / Arrow Keys = Move &nbsp; | &nbsp; R = Restart</div>
<div id="touch">
<button class="btn" id="up">▲</button><button class="btn" id="left">◀</button>
<button class="btn" id="right">▶</button><button class="btn" id="down">▼</button>
</div>
<div id="message"><div id="box"><h1 id="result"></h1><p id="resultText"></p><p>Press <b>R</b> to restart</p></div></div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x79aee8);
scene.fog=new THREE.Fog(0x79aee8,25,75);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xcfe8ff,0x315a31,2.1));
const sun=new THREE.DirectionalLight(0xffffff,2.8);
sun.position.set(-15,25,10);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

// Ground
const ground=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshStandardMaterial({color:0x4f984b}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

// Roads
const roadMat=new THREE.MeshStandardMaterial({color:0x30343a});
for(const [x,z,w,d] of [[0,0,8,80],[0,0,80,8]]){
 const r=new THREE.Mesh(new THREE.BoxGeometry(w,.08,d),roadMat);r.position.set(x,.03,z);scene.add(r);
}
const lineMat=new THREE.MeshBasicMaterial({color:0xf2df66});
for(let i=-35;i<=35;i+=5){
 for(const z of [-1.1,1.1]){
  const l=new THREE.Mesh(new THREE.BoxGeometry(.25,.04,2.2),lineMat);l.position.set(i,.1,z);scene.add(l);
 }
}

// Trees
function tree(x,z){
 const g=new THREE.Group();
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.25,.35,2,10),new THREE.MeshStandardMaterial({color:0x6b3e20}));
 trunk.position.y=1;trunk.castShadow=true;g.add(trunk);
 const crown=new THREE.Mesh(new THREE.SphereGeometry(1.25,16,12),new THREE.MeshStandardMaterial({color:0x1d702b}));
 crown.position.y=2.5;crown.castShadow=true;g.add(crown);
 g.position.set(x,0,z);scene.add(g);
}
[[-25,-25],[-25,25],[25,-25],[25,25],[-28,-10],[-28,12],[28,-12],[28,12],[-14,28],[14,-28]].forEach(p=>tree(...p));

// Buildings
const buildings=[];
function building(x,z,w,d,h){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:0x737b85,roughness:.8}));
 m.position.set(x,h/2,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);
 buildings.push({mesh:m,box:new THREE.Box3()});
}
building(-14,-12,8,7,4);building(15,13,8,7,5);building(-16,15,6,6,3.5);building(15,-14,7,6,4);

// Player
const player=new THREE.Group();
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,1.05,8,16),new THREE.MeshStandardMaterial({color:0x2d6cff}));
body.position.y=1.05;body.castShadow=true;player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.45,24,16),new THREE.MeshStandardMaterial({color:0xffc79b}));
head.position.y=2.05;head.castShadow=true;player.add(head);
player.position.set(0,0,27);scene.add(player);

// Enemy
const enemy=new THREE.Group();
const ebody=new THREE.Mesh(new THREE.CapsuleGeometry(.55,1.2,8,16),new THREE.MeshStandardMaterial({color:0xb51f2b}));
ebody.position.y=1.1;ebody.castShadow=true;enemy.add(ebody);
const ehead=new THREE.Mesh(new THREE.SphereGeometry(.5,20,14),new THREE.MeshStandardMaterial({color:0x8d151d}));
ehead.position.y=2.15;ehead.castShadow=true;enemy.add(ehead);
enemy.position.set(0,0,-27);scene.add(enemy);

// Enemy eyes
const eyeMat=new THREE.MeshBasicMaterial({color:0xffffcc});
for(const x of [-.17,.17]){const e=new THREE.Mesh(new THREE.SphereGeometry(.07,8,8),eyeMat);e.position.set(x,2.25,.43);enemy.add(e)}

// Coins
const coinPositions=[[-6,24],[7,23],[-18,20],[18,20],[-10,10],[11,9],[-22,2],[22,2],[-10,-5],[10,-5],[-18,-20],[18,-20]];
const coins=[];
for(const [x,z] of coinPositions){
 const c=new THREE.Mesh(new THREE.CylinderGeometry(.58,.58,.18,32),new THREE.MeshStandardMaterial({color:0xffd21a,metalness:.8,roughness:.18}));
 c.rotation.x=Math.PI/2;c.position.set(x,.9,z);c.castShadow=true;scene.add(c);coins.push(c);
}

// Power-up (speed boost)
const power=new THREE.Mesh(new THREE.OctahedronGeometry(.7),new THREE.MeshStandardMaterial({color:0x35e8ff,emissive:0x087c99,emissiveIntensity:1}));
power.position.set(0,.9,0);power.castShadow=true;scene.add(power);
let boost=0;

const keys={};
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==="r")location.reload()});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

// Touch controls
const touchMap={up:"w",down:"s",left:"a",right:"d"};
for(const id in touchMap){
 const b=document.getElementById(id),k=touchMap[id];
 b.addEventListener("pointerdown",e=>{e.preventDefault();keys[k]=true});
 ["pointerup","pointercancel","pointerleave"].forEach(ev=>b.addEventListener(ev,e=>{keys[k]=false}));
}

let score=0,health=100,gameOver=false,lastHit=0;
const playerBox=new THREE.Box3(),enemyBox=new THREE.Box3();
const clock=new THREE.Clock();

function updateUI(){
 document.getElementById("score").textContent=score;
 document.getElementById("health").textContent=Math.max(0,Math.ceil(health));
 document.getElementById("speed").textContent=boost>0?"BOOST!":"Normal";
}
function end(win){
 gameOver=true;
 document.getElementById("message").style.display="flex";
 document.getElementById("result").textContent=win?"🏆 YOU WIN!":"💀 GAME OVER";
 document.getElementById("resultText").textContent=win?"All 12 coins collected!":"The enemy caught you.";
}
function hitEnemy(){
 const now=performance.now();
 if(now-lastHit<700)return;
 lastHit=now;health-=20;
 player.position.z+=player.position.z>enemy.position.z?2:-2;
 player.position.x+=player.position.x>enemy.position.x?1:-1;
 updateUI();if(health<=0)end(false);
}

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);
 if(!gameOver){
  power.rotation.y+=.04;power.rotation.x+=.02;
  let dx=0,dz=0;
  if(keys.w||keys.arrowup)dz-=1;if(keys.s||keys.arrowdown)dz+=1;
  if(keys.a||keys.arrowleft)dx-=1;if(keys.d||keys.arrowright)dx+=1;
  const moving=dx||dz;
  if(moving){
   const len=Math.hypot(dx,dz);dx/=len;dz/=len;
   const sp=boost>0?.25:.15;
   const ox=player.position.x,oz=player.position.z;
   player.position.x+=dx*sp;player.position.z+=dz*sp;
   player.rotation.y=Math.atan2(dx,dz);
   playerBox.setFromObject(player);
   let blocked=false;
   for(const b of buildings){b.box.setFromObject(b.mesh);if(playerBox.intersectsBox(b.box)){blocked=true;break}}
   if(blocked){player.position.x=ox;player.position.z=oz}
  }
  if(boost>0)boost-=dt;
  if(boost<0)boost=0;

  // Enemy chase
  const ex=player.position.x-enemy.position.x,ez=player.position.z-enemy.position.z;
  const dist=Math.hypot(ex,ez);
  if(dist>1.5){
   const es=.075;
   enemy.position.x+=(ex/dist)*es;
   enemy.position.z+=(ez/dist)*es;
   enemy.rotation.y=Math.atan2(ex,ez);
  }else hitEnemy();

  // Coins
  for(let i=coins.length-1;i>=0;i--){
   const c=coins[i];c.rotation.z+=.07;c.position.y=.9+Math.sin(performance.now()*.004+i)*.12;
   if(player.position.distanceTo(c.position)<1.35){
    scene.remove(c);coins.splice(i,1);score++;updateUI();
    if(score===12)end(true);
   }
  }

  if(player.position.distanceTo(power.position)<1.5){
   boost=8;power.position.set(999,999,999);updateUI();
  }
  if(player.position.x<-37||player.position.x>37||player.position.z<-37||player.position.z>37){
   player.position.x=THREE.MathUtils.clamp(player.position.x,-36,36);
   player.position.z=THREE.MathUtils.clamp(player.position.z,-36,36);
  }

  const target=new THREE.Vector3(player.position.x,8.5,player.position.z+10);
  camera.position.lerp(target,.08);
  camera.lookAt(player.position.x,1,player.position.z);
 }
 renderer.render(scene,camera);
}
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
updateUI();camera.position.set(0,8.5,37);camera.lookAt(0,1,27);animate();
</script>
</body>
</html>
